<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Re:Space — 비주택 매입 사전판정</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --line: #dfe3e8; --ink: #1b1f24;
    --muted: #667085; --accent: #2f5d8a;
    --ok: #2f7a4d; --warn: #b57a12; --bad: #b3352f; --info: #2f5d8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Malgun Gothic", "맑은 고딕", -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.55;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 14px 24px 0;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: -.2px; }
  .brand .sub { color: var(--muted); font-size: 12px; }
  nav { display: flex; gap: 4px; margin-top: 12px; }
  nav button {
    border: 1px solid transparent; border-bottom: none; background: none;
    padding: 8px 16px; font: inherit; cursor: pointer; color: var(--muted);
    border-radius: 6px 6px 0 0;
  }
  nav button.on {
    background: var(--bg); border-color: var(--line); color: var(--ink);
    font-weight: 600; margin-bottom: -1px;
  }
  main { padding: 20px 24px 60px; max-width: 1240px; }

  /* 열자마자 보이는 3가지: 몇 세대 / 무엇이 병목 / 무슨 위험 */
  .headline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
  .hl { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .hl .k { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .hl .v { font-size: 26px; font-weight: 700; margin-top: 2px; letter-spacing: -.5px; }
  .hl .n { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; margin-bottom: 16px; }
  .card > h2 { font-size: 13px; margin: 0 0 12px; letter-spacing: .02em; color: var(--muted); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #eef3f8; }

  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .b-ok { background: #e6f3ec; color: var(--ok); }
  .b-warn { background: #fbf1dc; color: var(--warn); }
  .b-bad { background: #fbe9e8; color: var(--bad); }
  .b-info { background: #e8eef5; color: var(--info); }
  .b-mute { background: #eef0f2; color: var(--muted); }

  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  select, input[type=number] {
    font: inherit; padding: 5px 8px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--card); color: var(--ink);
  }
  input[type=number] { width: 118px; text-align: right; font-variant-numeric: tabular-nums; }

  .plan { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
  .plan svg { display: block; max-width: 100%; height: auto; }

  .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .alt { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--card); }
  .alt.best { border-color: var(--accent); box-shadow: 0 0 0 2px #e8eef5; }
  .alt h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .alt .big { font-size: 22px; font-weight: 700; letter-spacing: -.4px; }

  ul.reasons { margin: 6px 0 0; padding-left: 18px; }
  ul.reasons li { margin: 3px 0; }

  .note { font-size: 12px; color: var(--muted); }
  .warnbox { border-left: 3px solid var(--warn); background: #fdf8ee; padding: 10px 12px; border-radius: 0 6px 6px 0; margin-bottom: 12px; font-size: 13px; }
  .disclaimer { border-left: 3px solid var(--muted); background: #f1f3f5; padding: 10px 12px; border-radius: 0 6px 6px 0; font-size: 12.5px; color: #3c4450; }
  .mono { font-family: Consolas, "Courier New", monospace; font-size: 11.5px; word-break: break-all; }
  .hide { display: none; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; border: 1px solid rgba(0,0,0,.12); }
  @media print { nav, .controls { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Re:Space</h1>
    <span class="sub">비주택 매입 사전판정 시스템 — 무엇이 세대수를 묶고 있는가</span>
  </div>
  <nav id="nav"></nav>
</header>
<main>
  <div class="headline" id="headline"></div>
  <div id="view"></div>
</main>

<!--RESPACE_DATA-->
<script>
const D = window.__RESPACE__;
const fmt = n => (n === null || n === undefined) ? "—" : n.toLocaleString("ko-KR");
const pct = n => (n === null || n === undefined) ? "—" : Math.round(n * 100) + "%";
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

const GRADE_CLASS = {
  "우선검토": "b-ok", "검토 가능": "b-info",
  "조건부 검토": "b-warn", "부적합": "b-bad",
};
const BOTTLENECK_CLASS = { "평면": "b-info", "주차": "b-warn", "정화조": "b-warn" };
const REASON_COLOR = {
  egress_over_limit: "#c94c4c", no_window: "#d9a441",
  daylight_short: "#e0c46a", geometry: "#eeeeee",
};

let state = { tab: 0, building: 0, strategy: null, floor: 0 };

/* 해시 라우팅 — 특정 화면을 바로 열거나 링크로 공유할 수 있게 한다.
   #t2/b1/f3 = 대안 비교, 두 번째 건물, 4번째 층 */
function readHash() {
  const h = location.hash.replace(/^#/, "");
  if (!h) return;
  for (const part of h.split("/")) {
    const m = part.match(/^([tbf])(\d+)$/);
    if (!m) continue;
    const n = +m[2];
    if (m[1] === "t") state.tab = Math.min(n, 3);
    if (m[1] === "b") state.building = n;
    if (m[1] === "f") state.floor = n;
  }
  if (state.building >= D.buildings.length) state.building = 0;
}

function writeHash() {
  const h = `#t${state.tab}/b${state.building}/f${state.floor}`;
  if (location.hash !== h) history.replaceState(null, "", h);
}

const B = () => D.buildings[state.building];
const S = () => B().strategies[state.strategy ?? B().recommended];
const TABS = ["① 후보 건물", "② 건물 상세분석", "③ 대안 비교", "④ 검토보고서"];

function headline() {
  const b = B(), s = S();
  const blocked = s.caps.axes.filter(a => a.value === null);
  const risk = blocked.length
    ? `입력 미확보 ${blocked.length}건`
    : (s.verdict.grade === "부적합" ? "필수조건 미충족" : "치명적 위험 없음");
  const riskCls = blocked.length ? "b-warn" : (s.verdict.grade === "부적합" ? "b-bad" : "b-ok");
  document.getElementById("headline").innerHTML = `
    <div class="hl">
      <div class="k">공급 가능 세대수</div>
      <div class="v">${fmt(s.caps.supply)}<span style="font-size:14px;font-weight:500"> 세대</span></div>
      <div class="n">${esc(b.name)} · ${s.label} · 주거층 ${b.floors_analyzed.length}개</div>
    </div>
    <div class="hl">
      <div class="k">병목 축</div>
      <div class="v">${esc(s.caps.bottleneck_label)}</div>
      <div class="n">${esc(s.caps.axes.find(a => a.axis === s.caps.bottleneck).basis)}</div>
    </div>
    <div class="hl">
      <div class="k">위험 / 판정</div>
      <div class="v" style="font-size:20px">
        <span class="badge ${GRADE_CLASS[s.verdict.grade] || "b-mute"}">${esc(s.verdict.grade)}</span>
      </div>
      <div class="n"><span class="badge ${riskCls}">${esc(risk)}</span></div>
    </div>`;
}

/* ① 후보 건물 목록 — 다수 후보 중 추가 검토 대상을 빠르게 선별 */
function viewList() {
  const rows = D.buildings.map((b, i) => {
    const s = b.strategies[b.recommended];
    const blocked = s.caps.axes.filter(a => a.value === null).map(a => a.label);
    return `<tr class="click" data-b="${i}">
      <td><b>${esc(b.name)}</b><div class="note">${esc(b.use)} · 지상 ${b.floors_total}층</div></td>
      <td class="num">${fmt(s.caps.supply)}</td>
      <td><span class="badge ${BOTTLENECK_CLASS[s.caps.bottleneck_label] || "b-mute"}">${esc(s.caps.bottleneck_label)}</span></td>
      <td>${blocked.length ? `<span class="badge b-warn">${esc(blocked.join(", "))} 미확보</span>` : `<span class="badge b-ok">없음</span>`}</td>
      <td><span class="badge ${GRADE_CLASS[s.verdict.grade] || "b-mute"}">${esc(s.verdict.grade)}</span></td>
      <td class="num">${b.floors_analyzed.length}</td>
    </tr>`;
  }).join("");
  return `<div class="card">
    <h2>후보 건물 — 동일 기준 분석 결과</h2>
    <table>
      <thead><tr>
        <th>건물</th><th class="num">공급 세대</th><th>병목</th>
        <th>중대 위험</th><th>판정</th><th class="num">주거층</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="note" style="margin-bottom:0">행을 클릭하면 상세분석으로 이동한다. 값은 각 건물의 추천안 기준이다.</p>
  </div>`;
}

/* ② 건물 상세분석 */
function viewDetail() {
  const b = B(), s = S();
  const f = s.per_floor[Math.min(state.floor, s.per_floor.length - 1)];
  const rejByReason = {};
  f.rejected.forEach(r => {
    rejByReason[r.reason_label] = (rejByReason[r.reason_label] || 0) + 1;
  });
  const commonByReason = {};
  f.common_areas.forEach(a => {
    commonByReason[a.reason_label] = +( (commonByReason[a.reason_label] || 0) + a.area_m2 ).toFixed(2);
  });

  const floorRows = s.per_floor.map(x => `<tr>
    <td>${x.floor}층</td>
    <td class="num">${x.units.length}</td>
    <td class="num">${x.rejected.length}</td>
    <td>${esc(x.corridor_type)}</td>
    <td class="num">${x.egress.limit_m}m</td>
    <td class="num">${x.egress.over_limit_cells}</td>
    <td class="num">${x.free_m2}</td>
  </tr>`).join("");

  const passRows = f.units.slice(0, 8).map(u => `<tr>
    <td>${esc(u.type)}</td>
    <td class="num">${u.rect_mm[2]}×${u.rect_mm[3]}</td>
    <td class="num">${u.egress_dist_m}m</td>
    <td class="num">${pct(u.daylight_ratio)}</td>
    <td class="num">${u.shaft_dist_cells === null ? "—" : u.shaft_dist_cells}</td>
    <td class="num">${u.depth_from_window_m}m</td>
  </tr>`).join("");

  return `<div class="card">
    <div class="controls">
      <select id="selB">${D.buildings.map((x, i) =>
        `<option value="${i}" ${i === state.building ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
      <select id="selS">${Object.entries(b.strategies).map(([k, v]) =>
        `<option value="${k}" ${k === (state.strategy ?? b.recommended) ? "selected" : ""}>${esc(v.label)}</option>`).join("")}</select>
      <select id="selF">${s.per_floor.map((x, i) =>
        `<option value="${i}" ${i === state.floor ? "selected" : ""}>${x.floor}층</option>`).join("")}</select>
      <span class="note">필수조건: 계단 ${f.egress.stair_count}개소 · 피난 판정 ${f.egress.all_cores ? "모든 계단 충족" : "가장 가까운 계단"}</span>
    </div>
    <div class="plan">${s.svgs[f.floor] || "<p class='note'>도면 없음</p>"}</div>
    <div class="legend">
      <span><i class="sw" style="background:#4a7fb5"></i>청년형 18.0㎡</span>
      <span><i class="sw" style="background:#7b5ea7"></i>신혼형 28.8㎡</span>
      <span><i class="sw" style="background:#d8d8d8"></i>복도</span>
      <span><i class="sw" style="background:#4a4a4a"></i>코어</span>
      <span><i class="sw" style="background:#8a8a8a"></i>샤프트</span>
      <span><i class="sw" style="background:${REASON_COLOR.egress_over_limit}"></i>피난 초과</span>
      <span><i class="sw" style="background:${REASON_COLOR.no_window}"></i>창 미접</span>
      <span><i class="sw" style="background:${REASON_COLOR.daylight_short}"></i>채광 부족</span>
      <span><i class="sw" style="background:${REASON_COLOR.geometry}"></i>형상 미달</span>
    </div>
  </div>

  <div class="cols3">
    <div class="card"><h2>층별 세대수</h2>
      <table><thead><tr><th>층</th><th class="num">세대</th><th class="num">탈락</th>
        <th>복도</th><th class="num">피난한계</th><th class="num">초과셀</th><th class="num">가용㎡</th>
      </tr></thead><tbody>${floorRows}</tbody></table>
    </div>
    <div class="card"><h2>규정 미달 구역</h2>
      ${Object.keys(rejByReason).length
        ? `<table><tbody>${Object.entries(rejByReason).map(([k, v]) =>
            `<tr><td>${esc(k)}</td><td class="num">${v}세대</td></tr>`).join("")}</tbody></table>`
        : `<p class="note">이 층에는 탈락 세대가 없다.</p>`}
      <h2 style="margin-top:14px">공용 전환 면적</h2>
      <table><tbody>${Object.entries(commonByReason).map(([k, v]) =>
        `<tr><td>${esc(k)}</td><td class="num">${v}㎡</td></tr>`).join("") || `<tr><td class="note">없음</td></tr>`}</tbody></table>
    </div>
    <div class="card"><h2>세대 지표 (상위 8)</h2>
      <table><thead><tr><th>유형</th><th class="num">치수mm</th><th class="num">보행</th>
        <th class="num">채광비</th><th class="num">샤프트</th><th class="num">창깊이</th>
      </tr></thead><tbody>${passRows || `<tr><td class="note" colspan="6">배치된 세대 없음</td></tr>`}</tbody></table>
      <p class="note" style="margin-bottom:0">채광비는 창면적÷바닥면적. 법정 기준 10%.</p>
    </div>
  </div>`;
}

/* ③ 대안 비교 */
function viewCompare() {
  const b = B();
  const cards = Object.entries(b.strategies).map(([k, s]) => {
    const mix = Object.entries(s.mix).map(([t, n]) => `${esc(t)} ${n}`).join(" · ") || "없음";
    return `<div class="alt ${k === b.recommended ? "best" : ""}">
      <h3>${esc(s.label)} ${k === b.recommended ? '<span class="badge b-info">추천</span>' : ""}</h3>
      <div class="big">${fmt(s.caps.supply)} 세대</div>
      <div class="note">${mix}</div>
      <table style="margin-top:10px"><tbody>
        <tr><td>병목</td><td class="num"><span class="badge ${BOTTLENECK_CLASS[s.caps.bottleneck_label] || "b-mute"}">${esc(s.caps.bottleneck_label)}</span></td></tr>
        <tr><td>설비 재사용률</td><td class="num">${pct(s.quantities.shaft_reuse_ratio)}</td></tr>
        <tr><td>신설 벽체</td><td class="num">${fmt(s.quantities.new_wall_m)} m</td></tr>
        <tr><td>공용 전환</td><td class="num">${fmt(s.quantities.common_area_m2)} ㎡</td></tr>
        <tr><td>채광 탈락</td><td class="num">${s.rejected_total} 세대</td></tr>
        <tr><td>판정</td><td class="num"><span class="badge ${GRADE_CLASS[s.verdict.grade] || "b-mute"}">${esc(s.verdict.grade)}</span></td></tr>
      </tbody></table>
      <div class="plan" style="margin-top:10px">${s.svgs[b.floors_analyzed[0]] || ""}</div>
    </div>`;
  }).join("");

  return `<div class="card">
    <h2>추천안과 근거</h2>
    <ul class="reasons">${b.recommend_reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
  </div>
  <div class="cols3">${cards}</div>
  <div class="card"><p class="note" style="margin:0">
    세 안은 알고리즘이 아니라 <b>유닛 조합과 배치 우선순위</b>만 다르다.
    저개입형은 기존 샤프트 재사용 범위 밖에 세대를 놓지 않으므로 세대수가 줄고 배관 신설이 0 이 된다.
  </p></div>`;
}

/* ④ 검토보고서 */
function viewReport() {
  const b = B(), s = S();
  const axes = s.caps.axes.map(a => `<tr>
    <td>${esc(a.label)}</td>
    <td class="num">${a.value === null ? '<span class="badge b-warn">미확보</span>' : fmt(a.value) + " 세대"}</td>
    <td class="note">${esc(a.blocked_reason || a.basis)}</td>
  </tr>`).join("");

  const missing = s.caps.axes.filter(a => a.value === null);
  const q = s.quantities;

  return `
  ${!s.caps.complete ? `<div class="warnbox"><b>잠정 결과</b> — ${esc(s.caps.note)}</div>` : ""}
  <div class="card">
    <h2>최종 판정</h2>
    <p style="margin:0 0 8px"><span class="badge ${GRADE_CLASS[s.verdict.grade] || "b-mute"}" style="font-size:14px;padding:3px 12px">${esc(s.verdict.grade)}</span></p>
    <ul class="reasons">${s.verdict.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
  </div>

  <div class="card"><h2>3축 상한</h2>
    <table><thead><tr><th>축</th><th class="num">상한</th><th>근거</th></tr></thead>
    <tbody>${axes}</tbody></table>
  </div>

  <div class="card"><h2>산출 물량</h2>
    <table><tbody>
      <tr><td>세대수</td><td class="num">${fmt(q.units_total)} 세대</td></tr>
      <tr><td>신설 벽체</td><td class="num">${fmt(q.new_wall_m)} m</td></tr>
      <tr><td>철거 벽체</td><td class="num">— <span class="note">기존 내부 벽이 입력 규격에 없어 산출 불가</span></td></tr>
      <tr><td>설비 재사용률</td><td class="num">${pct(q.shaft_reuse_ratio)}</td></tr>
      <tr><td>공용 전환 면적</td><td class="num">${fmt(q.common_area_m2)} ㎡</td></tr>
      <tr><td>주차 (${esc(q.parking.basis)})</td>
          <td class="num">필요 ${fmt(q.parking.required)} / 기존 ${fmt(q.parking.existing)} / 부족 ${fmt(q.parking.shortfall)}</td></tr>
      <tr><td>정화조 (${esc(q.septic.basis)})</td>
          <td class="num">필요 ${fmt(q.septic.required_m3)} / 기존 ${fmt(q.septic.existing_m3)} / 부족 ${fmt(q.septic.shortfall_m3)} ㎥</td></tr>
    </tbody></table>
  </div>

  <div class="card">
    <h2>개략 사업비 — 단가는 사용자 입력</h2>
    <div class="warnbox" style="border-color:var(--info);background:#eef3f8">
      시스템은 <b>물량까지만</b> 산출한다. 아래 단가는 사용자가 입력하는 값이며
      시스템이 제시하는 값이 아니다. 발주처 표준단가를 넣어 쓸 것.
    </div>
    <div class="controls">
      <label>세대당 내장 <input type="number" id="p_unit" value="0" step="10"> 만원</label>
      <label>벽체 신설 <input type="number" id="p_wall" value="0" step="1"> 만원/m</label>
      <label>주차 증설 <input type="number" id="p_park" value="0" step="10"> 만원/대</label>
      <label>정화조 증설 <input type="number" id="p_sep" value="0" step="10"> 만원/㎥</label>
    </div>
    <table><tbody id="costRows"></tbody></table>
  </div>

  <div class="card"><h2>추가 제출자료 · 전문가 검토 필요</h2>
    <ul class="reasons">
      ${missing.map(a => `<li><b>${esc(a.label)} 축</b> — ${esc(a.blocked_reason)}</li>`).join("")}
      <li>구조안전 검토 — 벽체 철거·개구부 신설 영향 (범위 밖)</li>
      <li>소방 검토 — 스프링클러·방화구획·제연 (범위 밖)</li>
      <li>용도지역상 주택 허용 여부 및 시설군 변경 가능성 확인</li>
      ${b.source_note ? `<li>${esc(b.source_note)}</li>` : ""}
    </ul>
  </div>

  <div class="card"><h2>적용 기준과 검토 이력</h2>
    <table><tbody>
      <tr><td>기준 버전</td><td>rules ${esc(D.rules_version)}</td></tr>
      <tr><td>격자</td><td>${D.grid_mm}mm</td></tr>
      <tr><td>분석 시각</td><td>${esc(D.generated_at || "—")}</td></tr>
      <tr><td>분석 층</td><td>${b.floors_analyzed.join(", ")}층</td></tr>
      <tr><td>입력 해시</td><td class="mono">${Object.entries(s.input_hash).map(([k, v]) =>
        `${esc(k)} ${esc(v.slice(0, 23))}…`).join("<br>")}</td></tr>
    </tbody></table>
    <p class="note">같은 입력이면 항상 같은 결과가 나온다. 해시로 어느 도면의 결과인지 추적된다.</p>
  </div>

  <div class="disclaimer">${esc(D.disclaimer)}</div>`;
}

function costs() {
  const el = document.getElementById("costRows");
  if (!el) return;
  const q = S().quantities;
  const v = id => parseFloat(document.getElementById(id).value) || 0;
  const rows = [
    ["세대 내장공사", q.units_total, "세대", v("p_unit")],
    ["벽체 신설", q.new_wall_m, "m", v("p_wall")],
    ["주차 증설", q.parking.shortfall ?? 0, "대", v("p_park")],
    ["정화조 증설", q.septic.shortfall_m3 ?? 0, "㎥", v("p_sep")],
  ];
  let total = 0;
  const html = rows.map(([name, qty, unit, price]) => {
    const sum = qty * price;
    total += sum;
    return `<tr><td>${name}</td><td class="num">${fmt(qty)} ${unit}</td>
      <td class="num">× ${fmt(price)} 만원</td><td class="num">${fmt(Math.round(sum))} 만원</td></tr>`;
  }).join("");
  const per = q.units_total ? Math.round(total / q.units_total) : 0;
  el.innerHTML = html + `<tr><td><b>합계</b></td><td></td><td></td>
    <td class="num"><b>${fmt(Math.round(total))} 만원</b></td></tr>
    <tr><td class="note">세대당</td><td></td><td></td><td class="num note">${fmt(per)} 만원</td></tr>`;
}

function render() {
  writeHash();
  document.getElementById("nav").innerHTML = TABS.map((t, i) =>
    `<button class="${i === state.tab ? "on" : ""}" data-t="${i}">${t}</button>`).join("");
  headline();
  document.getElementById("view").innerHTML =
    [viewList, viewDetail, viewCompare, viewReport][state.tab]();

  document.querySelectorAll("#nav button").forEach(x =>
    x.onclick = () => { state.tab = +x.dataset.t; render(); });
  document.querySelectorAll("tr.click").forEach(x =>
    x.onclick = () => { state.building = +x.dataset.b; state.strategy = null; state.floor = 0; state.tab = 1; render(); });

  const sb = document.getElementById("selB");
  if (sb) sb.onchange = e => { state.building = +e.target.value; state.strategy = null; state.floor = 0; render(); };
  const ss = document.getElementById("selS");
  if (ss) ss.onchange = e => { state.strategy = e.target.value; render(); };
  const sf = document.getElementById("selF");
  if (sf) sf.onchange = e => { state.floor = +e.target.value; render(); };

  ["p_unit", "p_wall", "p_park", "p_sep"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.oninput = costs;
  });
  costs();
}

readHash();
render();
</script>
</body>
</html>
