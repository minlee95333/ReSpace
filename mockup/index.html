<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI CCTV 배치 적정성 평가</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAIklEQVR42mPg9u8iCTEMTw3/kQBhDf8xwNDTQLKnR0TSAACXXScw+G9yggAAAABJRU5ErkJggg==">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="fonts.css">
<style>
/* 한 화면 · 무스크롤 · 탭 전환 · 소프트 엘리베이션 (2026-08-21 채택)
 *
 * 종전 화면은 세로로 길어 스크롤해야 다 보였다. 심사 PT 에서 스크롤은 손해다.
 * 100dvh 안에 다 넣고 세부는 탭으로 가른다.
 *
 * 세 가지가 종전과 다르다.
 *   ① 레이아웃 — 100dvh 안에 다 넣고 페이지는 스크롤하지 않는다. 세부는 탭으로.
 *   ② 그림자 — A-3 강도. 아래 「대비」 주석 참조.
 *   ③ 폰트 — Wanted Sans(본문) + IBM Plex Mono(숫자) 서브셋 임베드
 *          (fonts.css · tools/make_webfont.py 가 만든다). 외부 요청은 여전히 0 이다.
 *
 * ── 대비에 대하여 ────────────────────────────────────────────────────────
 * A-3 은 그림자를 세게 준다. 그래도 **경계선을 지우지 않는다.** 뉴모피즘 정석은
 * 요소와 배경을 같은 색으로 두고 그림자로만 구분하는데, 그러면 UI 경계 대비가
 * 정의상 1.0:1 이 되어 기준(3:1)을 못 지킨다. 이 화면은 적록색약 문제를 잡느라
 * 색 스케일을 갈아엎은 직후라 그 방향으로 되돌릴 수 없다.
 * 그림자는 잉크 색의 알파일 뿐 새 색상을 만들지 않는다 — "색은 데이터에만".
 */

*{box-sizing:border-box}
html,body{height:100%;overflow:clip}            /* 페이지는 스크롤하지 않는다 */
body{
  margin:0;background:var(--color-paper);color:var(--color-ink);
  font:var(--text-base)/1.55 var(--font-ui);
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* 고정폭은 **주인공 수치와 코드에만** 쓴다.
 *
 * 한때 표·정의목록 값까지 걸었다가 물렸다 — "78,816개" 처럼 단위가 한글이면
 * 숫자는 고정폭, 단위는 본문으로 렌더돼 한 낱말 안에서 서체가 바뀐다. 자릿수
 * 맞추기는 tabular-nums 로 충분하고 그건 본문 벌에도 있다.
 * 남는 자리는 KPI(순수 숫자·기호)와 코드·식별자다. */
.mono,.kpi .v,code{
  font-family:var(--font-num);
  font-variant-numeric:tabular-nums;
}
code{font-size:.94em}

/* **작은 글씨 규칙.** 11~12px 한글은 400 으로 두면 회색 배경에서 획이
 * 끊긴다. 굵기를 500 으로 올리고 자간을 좁히는 대신 벌린다. 크기를 키우면
 * 한 화면에 안 들어가므로 크기 말고 이 둘로 읽히게 만든다. */
.sm-text,.brand p,.kpi .k,label,.seg button,.tab,table,.kv,.foot,.pill{
  font-weight:500;
  letter-spacing:var(--track-small);
}

:root{
  /* A-3 — 종전(A안)보다 오프셋·블러·알파를 키웠다 */
  --sd:  oklch(21.2% 0.009 256 / 0.16);
  --sd2: oklch(21.2% 0.009 256 / 0.10);
  --sl:  oklch(100% 0 0 / 0.95);
  --raise:    10px 10px 24px -10px var(--sd), -9px -9px 20px -10px var(--sl);
  --raise-sm:  5px  5px 13px -6px var(--sd2), -5px -5px 12px -6px var(--sl);
  --inset:    inset 5px 5px 11px -6px var(--sd2), inset -4px -4px 10px -6px var(--sl);
  --pad: clamp(10px, 1.1vw, 18px);
}

/* ── 골격 ─────────────────────────────────────────────────────────── */
.app{
  height:100dvh;display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:var(--pad);padding:var(--pad);
}

/* ── 머리 — 제목 + KPI 한 줄 ─────────────────────────────────────── */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;
     gap:var(--pad);align-items:center}
.brand{min-width:0}
.brand h1{margin:0;font-size:clamp(15px,1.35vw,20px);font-weight:700;
          letter-spacing:-.025em;line-height:1.15;overflow-wrap:anywhere}
.brand p{margin:3px 0 0;font-size:var(--text-2xs);color:var(--color-muted);
         line-height:1.45}

.kpis{display:flex;gap:var(--pad);flex-wrap:wrap;min-width:0}
.kpi{
  background:var(--color-paper-2);border:var(--rule-hair) solid var(--color-rule);
  border-radius:14px;padding:8px 14px;min-width:118px;
  box-shadow:var(--raise-sm);
}
.kpi.hi{border-color:var(--color-ink-2);box-shadow:var(--raise)}
.kpi .k{font-size:var(--text-2xs);color:var(--color-muted);letter-spacing:.05em}
/* 고정폭은 이미 글자마다 폭이 같다. 여기에 큰 음수 자간까지 걸면 숫자가
 * 서로 붙어 붙임체처럼 보인다. 살짝만 조인다. */
.kpi .v{font-size:clamp(16px,1.6vw,25px);font-weight:600;letter-spacing:-.012em;
        line-height:1.12;margin-top:2px}
.kpi.hi .v{color:var(--color-ink)}
.kpi:not(.hi) .v{color:var(--color-ink-2)}
/* 점수 카드 — 이 화면의 초점이다. 홀로 서므로 크기와 여백으로 이긴다. */
.kpi.score{min-width:230px;padding:10px 18px}
.kpi.score .v{font-size:clamp(24px,2.6vw,40px);display:flex;align-items:baseline;gap:7px}
.kpi.score .unit{font-size:.42em;font-weight:500;color:var(--color-muted);
  font-family:var(--font-ui);letter-spacing:0}
.kpi.score .grade{margin-left:auto;font-family:var(--font-ui);font-size:.34em;
  font-weight:700;letter-spacing:.04em;color:var(--color-ink-2);
  border:var(--rule-hair) solid var(--color-rule);border-radius:var(--radius-chip);
  padding:2px 8px;align-self:center}
.kpi.score .note{font-size:var(--text-3xs);color:var(--color-muted);
  font-weight:500;letter-spacing:var(--track-small);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch}

/* ── 본문 — 지도 + 탭 패널 ───────────────────────────────────────── */
.main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr);
      gap:var(--pad);min-height:0}
.panel{
  background:var(--color-paper-2);border:var(--rule-hair) solid var(--color-rule);
  border-radius:18px;box-shadow:var(--raise);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.panel > .head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px var(--pad) 8px;border-bottom:var(--rule-hair) solid var(--color-rule-2)}
.panel > .head h2{margin:0;font-size:var(--text-sm);font-weight:600;letter-spacing:-.01em}
.panel > .body{flex:1;min-height:0;padding:var(--pad);overflow:auto}
.panel > .body.flush{padding:8px}

canvas{display:block;width:100%;height:100%;
       background:var(--color-paper);border-radius:12px;
       border:var(--rule-hair) solid var(--color-rule-2)}
.canvaswrap{flex:1;min-height:0;padding:8px}
/* 설치 가능 구역 오버레이. **배경과 테두리를 지운다** — canvas 규칙이
 * background:var(--color-paper) 를 걸어 두어서, 그대로 두면 겹친 캔버스가
 * 불투명한 종이가 되어 지도를 통째로 가린다. 실제로 히트맵이 사라졌다. */
#pmOv{background:none;border:0;border-radius:0}

/* ── 컨트롤 ───────────────────────────────────────────────────────── */
.seg{display:inline-flex;border:var(--rule-hair) solid var(--color-muted);
     border-radius:11px;overflow:hidden;box-shadow:var(--raise-sm)}
.seg button{border:0;background:var(--color-paper-2);cursor:pointer;
  font:inherit;font-size:var(--text-2xs);color:var(--color-muted);
  padding:5px 11px;border-right:var(--rule-hair) solid var(--color-rule);
  transition:background var(--dur-short) var(--ease-out),color var(--dur-short) var(--ease-out)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--color-paper-3);color:var(--color-ink)}
.seg button[aria-pressed="true"]{background:var(--color-chrome);color:var(--color-paper-2);
  box-shadow:var(--inset)}
/* 배치 전/후 탭 — 2D·3D 토글과 같은 급으로 보이면 안 된다. 이게 이 도구의
 * 논증 축이고 저쪽은 표시 옵션이다. 크기·굵기·번호로 급을 갈라 준다. */

/* 델타 띠 — 어느 탭에 있든 양쪽 값을 같이 보인다. 탭을 왕복하며 기억으로
 * 비교하게 두면 전후를 못 느낀다. */
.delta{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;
  padding:7px 12px;margin:0 8px;border-radius:10px;
  background:var(--color-paper-3);border:var(--rule-hair) solid var(--color-rule);
  font-size:var(--text-2xs);color:var(--color-muted)}
.delta b{color:var(--color-ink);font-weight:600}
.delta .arrow{color:var(--color-muted);padding:0 1px}
.delta .gain{color:var(--color-ink);font-weight:600}
.mbtn{border:var(--rule-hair) solid var(--color-rule);background:var(--color-paper-3);
  border-radius:9px;padding:4px 10px;cursor:pointer;font:inherit;
  font-size:var(--text-2xs);color:var(--color-ink-2)}
.mbtn:hover{background:var(--color-paper-2);color:var(--color-ink)}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:3px 10px;
  font-size:var(--text-2xs);max-height:none}
.mlist label{gap:6px;padding:2px 0;cursor:pointer}
.mlist .mnt{color:var(--color-muted)}
.mlist h4{grid-column:1/-1;margin:8px 0 2px;font-size:var(--text-2xs);
  color:var(--color-muted);font-weight:600;letter-spacing:.04em}
label{font-size:var(--text-2xs);color:var(--color-ink-2);display:inline-flex;
      gap:5px;align-items:center;cursor:pointer}
input[type=radio],input[type=checkbox]{accent-color:var(--color-chrome);margin:0}
:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}

/* ── 탭 — 세부는 여기서 갈아 끼운다 ──────────────────────────────── */
.tabs{display:flex;gap:6px;padding:8px var(--pad) 0;flex-wrap:wrap}
.tab{
  border:var(--rule-hair) solid var(--color-rule);background:var(--color-paper-3);
  border-radius:11px 11px 0 0;border-bottom:0;padding:6px 13px;cursor:pointer;
  font:inherit;font-size:var(--text-2xs);color:var(--color-muted);
  box-shadow:var(--inset);
}
.tab[aria-selected="true"]{
  background:var(--color-paper-2);color:var(--color-ink);font-weight:600;
  box-shadow:var(--raise-sm);border-color:var(--color-ink-2);
}
.tabpanel{display:none}
.tabpanel.on{display:block}

/* ── 표 ───────────────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:var(--text-2xs)}
th,td{text-align:left;padding:5px 7px;border-bottom:var(--rule-hair) solid var(--color-rule-2)}
th{position:sticky;top:0;background:var(--color-paper-3);color:var(--color-ink-2);
   font-weight:600;letter-spacing:.05em}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
tbody tr:hover{background:var(--color-paper-3)}
.pill{display:inline-block;padding:0 7px;border-radius:8px;font-size:var(--text-2xs);
      background:var(--color-paper-3);color:var(--color-muted);box-shadow:var(--raise-sm)}
.pill.w5{background:var(--color-w5-bg);color:var(--color-w5);box-shadow:none}
.pill.w4{background:var(--color-w4-bg);color:var(--color-w4);box-shadow:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:var(--text-2xs)}
.kv dt{color:var(--color-muted)}
.kv dd{margin:0;text-align:right;font-weight:500;color:var(--color-ink-2);
       font-variant-numeric:tabular-nums}

/* ── 발 — 범례 ────────────────────────────────────────────────────── */
.chip.ghost{background:none;border:1.2px dashed var(--color-muted);border-radius:50%}
.foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
      font-size:var(--text-2xs);color:var(--color-muted);padding:0 4px;
      line-height:1.5}
.ramp{display:inline-flex;height:11px;border:var(--rule-hair) solid var(--color-rule);
      border-radius:3px;overflow:hidden}
.ramp i{display:block;width:20px}
.chip{display:inline-block;width:10px;height:10px;border-radius:3px;
      vertical-align:-1px;margin-right:3px}
.chip.fail{background:var(--scale-0);outline:1.5px solid var(--color-ink);outline-offset:-1.5px}
.chip.mid{background:var(--scale-75);opacity:.30}
.chip.clear{background:transparent;border:1px solid var(--color-rule)}
.err{margin:auto;max-width:520px;color:var(--color-w5);background:var(--color-w5-bg);
     border:var(--rule-hair) solid var(--color-w5);border-radius:14px;padding:16px}

@media (max-width:1000px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.2fr) minmax(0,1fr)}
}
/* 태블릿 세로 이하 — 제목과 KPI 를 위아래로 가른다. 나란히 두면 KPI 가
   제 최소폭을 지키려다 화면 밖으로 나간다. */
@media (max-width:640px){
  .top{grid-template-columns:minmax(0,1fr)}
  .kpis{gap:8px}
  .kpi{flex:1 1 132px;min-width:0;padding:7px 11px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms !important}}
</style>
</head>
<body>
<div class="app" id="app"><p class="err">데이터를 읽는 중…</p></div>

<script src="data.js"></script>
<script src="theme.js"></script>
<script src="viewer.js"></script>
<!-- 배치 기능. place.html 과 **같은 엔진**을 쓴다 — 두 화면이 다른 값을
     내면 안 된다. site.js 는 file:// 폴백이고 정본은 site.json 이다. -->
<script src="engine.js"></script>
<script src="mounts.js"></script>
<script src="site.js" onerror="window.__noSiteJs = true"></script>
<script src="plan.js"></script>
<script>
const pct = v => (v*100).toFixed(1) + '%';
let D = null, VIEW = 'empirical', MODE = '2d', VIEWER = null;

function rampHTML(){
  const N = 20, out = [];
  for (let i=0;i<N;i++) out.push(`<i style="background:${Theme.css(Theme.heat(i/(N-1)))}"></i>`);
  return out.join('');
}

function render(){
  const d = D, P = d.placements;
  const view = P[VIEW] ? VIEW : Object.keys(P)[0];
  const shown = P[view], key = 'P_total_' + view;
  const geo = P.geometric, asm = P.assumed, emp = P.empirical;
  const fails = (shown.fail_zones || d.fail_zones || [])
    .slice().sort((a,b)=> b.w-a.w || a.P_total-b.P_total);
  const rc = {}; fails.forEach(f=>rc[f.reason]=(rc[f.reason]||0)+1);
  const base = d.geometric_baseline, ps = d.dori_pair_stats;
  /* 100점 만점 채점 (src/score.py). 배치 하나를 구역별 배점으로 채점한다 -
     화면 머리의 대표 숫자가 이것이다. 옛 산출물에는 없으므로 없으면 '—'. */
  const sc = shown.score || null;
  /* 두 배치가 공유하는 카메라와 갈리는 카메라. 탐욕이 1:1 대응을 만들지
     않으므로 "어느 대가 어디로 갔다"는 말은 못 한다 — 빠진 자리와 새 자리를
     각각 셀 뿐이다. */
  /* 분모는 전체 복셀이 아니라 **작업자가 설 수 있는 칸**이다. 공중이나 구조체
     내부를 분모에 넣으면 미달률이 부풀려진다. */
  const nOcc = d.voxels.reduce((n,v)=> n + (v.occupiable===false?0:1), 0);
  const gi = (geo&&geo.camera_ids)||[], ei = (emp&&emp.camera_ids)||[];
  const kept = gi.filter(x=>ei.includes(x)).length;
  const moved = ei.length - kept;
  /* 잔상 — 지금 보는 배치에는 없고 다른 배치에만 있는 카메라 자리 */
  const other = view==='empirical' ? gi : (view==='geometric' ? ei : []);
  const ghosts = other.filter(x=>!((shown.camera_ids)||[]).includes(x));

  document.getElementById('app').innerHTML = `
  <div class="top">
    <div class="brand">
      <h1>AI CCTV 배치 적정성 평가</h1>
      <p>안전모 미착용 검출확률 기준 · 카메라 ${d.camera_budget}대
        · 작업자 활동공간 ${nOcc.toLocaleString()}칸</p>
      <!-- **이 화면은 읽는 자리다.** 카메라를 놓는 것은 place.html 이며,
           그 길을 화면 안에 둔다 - 파일 목록에서 찾게 하지 않는다. -->
      <p style="margin-top:6px">
        <a href="place.html" style="font-size:var(--text-2xs);color:var(--color-ink-2)"
           title="도면에서 카메라를 직접 놓고 그 자리에서 검출확률을 잰다"
          >← 카메라를 직접 놓으려면 <b>배치 도구</b>로</a></p>
    </div>
    <div class="kpis">
      <!-- 자동 배치를 범위에서 뺀 뒤로 "현재/제안 배치·개선폭" 은 잴 대상이
           없어졌다. 그 자리에 **배치 하나를 100점으로 채점한 값**을 둔다.
           배점은 가중치에 비례하고 면적과 무관하다 - 넓은 저위험 구역을 덮어
           갱폼을 통째로 놓치고도 높은 점수가 나오는 것을 막는다(src/score.py). -->
      ${sc ? `
      <div class="kpi hi score">
        <div class="k">배치 점수 · 100점 만점</div>
        <div class="v">${sc.total.toFixed(1)}<span class="unit">점</span>
          <span class="grade">${sc.grade}</span></div>
        <div class="note">${sc.grade_capped_by_critical
          ? `치명 구역 ${sc.critical_failures.length}곳이 요구 미달 — 등급 상한 ${sc.grade}`
          : (sc.biggest_loss ? `가장 많이 잃은 곳 · ${
              (sc.rows.find(r=>r.zone===sc.biggest_loss)||{}).label || sc.biggest_loss
            }` : '')}</div>
      </div>` : `
      <div class="kpi hi score"><div class="k">배치 점수 · 100점 만점</div>
        <div class="v">—</div>
        <div class="note">python src/report.py 로 산출한다</div></div>`}
    </div>

function mountMap(view, ghosts, camIds){
  const cv = document.getElementById('map');
  const box = cv.parentElement.getBoundingClientRect();
  cv.style.height = Math.max(180, box.height - 16) + 'px';
  VIEWER = new CoverageViewer.Viewer(cv, D, {
    mode: MODE, level: 0, key: 'P_total_' + view,
    // 직접 배치는 placements 에 없으므로 목록을 그대로 받는다. 빈 배열을
    // 넘기면 뷰어가 "선택 없음 = 전부 선택"으로 읽어 후보가 다 켜진다.
    cameraIds: camIds || (D.placements[view]||{}).camera_ids || [],
    ghostCameraIds: ghosts || [],
  });
  VIEWER.setMode(MODE);
}

/* ── 지도에서 직접 배치 (2026-08-28) ─────────────────────────────────
 *
 * **새 화면을 만들지 않는다.** 이 화면에서 놓을 수 있어야 한다는 요구다.
 * place.html 과 **같은 engine.js·mounts.js** 를 쓴다 - 두 화면이 다른 값을
 * 내면 어느 쪽을 믿어야 할지 알 수 없다.
 *
 * 인덱스 다리 - 엔진은 210x125x15 격자 전체를 t 로 훑고, 뷰어는 사람이 설
 * 수 있는 복셀만 목록으로 든다. 둘을 t = ix + nx*(iy + ny*iz) 로 잇는다.
 */
let ENG = null, MD = null, PM = false, PMH = null, PMIDX = null, PMBASE = null;

async function pmLoad(){
  if (ENG) return true;
  let sd = null;
  try { sd = await fetch('site.json').then(r => r.json()); }
  catch (e) { sd = (typeof window.SITE_RULES !== 'undefined') ? window.SITE_RULES : null; }
  if (!sd) return false;
  ENG = new CoverageEngine.Engine(sd);
  MD = { site: sd.site, mounts: JSON.parse(JSON.stringify(sd.mounts)), solids: sd.solids };
  // **엔진은 격자 전체를 훑지 않는다.** 구조체 안쪽을 뺀 384,615칸만 담고
  // V.index[t] 에 원래 격자 번호를 들고 있다. 우리는 그 반대가 필요하다 -
  // 뷰어 복셀의 격자 번호로 엔진 슬롯 t 를 찾아야 한다. 역표를 한 번 만든다.
  // (종전에 격자 번호를 그대로 t 로 썼다가 P 가 전부 어긋났다.)
  const S = sd.site, step = S.voxel_m;
  const back = new Map();
  const gi = sd.voxels.index;
  for (let t = 0; t < gi.length; t++) back.set(gi[t], t);
  PMIDX = D.voxels.map(v => {
    const g = Math.floor(v.x / step)
      + S.nx * (Math.floor(v.y / step) + S.ny * Math.floor(v.z / step));
    const t = back.get(g);
    return t === undefined ? -1 : t;        // -1 = 엔진이 안 세는 칸
  });
  return true;
}

function pmBar(html){
  const b = document.getElementById('pmBar');
  if (b) b.innerHTML = html;
}

/* 엔진이 낸 P 를 뷰어 복셀에 옮겨 적고 화면을 다시 그린다. */
function pmPaint(){
  const p = ENG.pTotal();
  for (let i = 0; i < D.voxels.length; i++) {
    const t = PMIDX[i];
    D.voxels[i].P_total_manual = t < 0 ? null : p[t];   // null 은 뷰어가 건너뛴다
  }
  const m = ENG.metrics();
  const ids = ENG.cams.map((c, i) => 'u' + i);
  D.cameras = PMBASE.concat(ENG.cams.map((c, i) => (
    { id: 'u' + i, x: c.x, y: c.y, z: c.z, mount: 'user', yaw_deg: c.yaw || 0 })));
  pmBar(`<span>놓은 카메라 <b>${m.n_cameras}대</b></span>`
    + `<span>인식 가능 공간 <b>${pct(m.spatial_coverage || 0)}</b></span>`
    + `<span>WDR <b>${pct(m.WDR || 0)}</b></span>`
    + `<span>미달 <b>${(m.fail_voxels || 0).toLocaleString()}</b>`
    + ` / ${(m.denominator_voxels || 0).toLocaleString()}</span>`
    + (m.n_cameras ? '' : '<span style="color:var(--color-muted)">'
        + '지도에서 설치 가능한 자리를 누르세요</span>'));
  // **뷰어를 다시 만들지 않는다.** mountMap 은 Viewer 를 새로 세우는데,
  // 그 경로로 가면 화면이 비어 나왔다(원인 미상). 기존 뷰어의 키와 카메라
  // 목록만 갈아 끼우면 같은 결과를 훨씬 적은 일로 얻는다.
  VIEWER.opts.cameraIds = ids;
  VIEWER.set('key', 'P_total_manual');
  pmDrawOverlay();
}

/* 설치 가능한 자리를 지도에 겹쳐 그린다.
 *
 * **이게 없으면 클릭이 찍기가 된다.** 4m 격자로 재보면 210x125m 중 설치
 * 가능한 표본이 10% 뿐이다 - 어디를 눌러야 하는지 화면이 말해 주지 않으면
 * 열 번 눌러 아홉 번 거절당한다. place.html 이 파란 구역을 칠하는 이유다.
 *
 * 높이가 바뀔 때만 다시 재고(무겁다), 그림은 투영만 다시 한다.
 */
let PMOK = null, PMOKH = null;

function pmScanPlaceable(){
  if (PMOKH === PMH && PMOK) return PMOK;
  const step = 2, W = MD.site.width_m, Dp = MD.site.depth_m;
  const out = [];
  for (let x = step / 2; x < W; x += step)
    for (let y = step / 2; y < Dp; y += step)
      if (Mounts.placeable(MD, x, y, PMH)) out.push([x, y]);
  PMOK = out; PMOKH = PMH;
  return out;
}

function pmDrawOverlay(){
  const ov = document.getElementById('pmOv'), map = document.getElementById('map');
  if (!ov || !map) return;
  if (!PM) { ov.style.display = 'none'; return; }
  const dpr = window.devicePixelRatio || 1;
  ov.style.display = '';
  ov.style.width = map.clientWidth + 'px';
  ov.style.height = map.clientHeight + 'px';
  ov.width = Math.max(1, Math.round(map.clientWidth * dpr));
  ov.height = Math.max(1, Math.round(map.clientHeight * dpr));
  const c = ov.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, ov.width, ov.height);
  const pts = pmScanPlaceable();
  // 설치 가능 표시는 데이터가 아니라 조작 안내다. 히트맵 색과 섞이지 않도록
  // 채도 없는 파랑 하나만 옅게 쓴다.
  c.fillStyle = 'rgba(40,110,220,0.22)';
  const half = Math.max(2, (VIEWER._fit ? VIEWER._fit.s : 3) * 1.0);
  for (const [x, y] of pts) {
    const q = VIEWER._project(x, y, PMH);
    if (!q) continue;
    c.fillRect(q.x - half / 2, q.y - half / 2, half, half);
  }
  c.fillStyle = 'rgba(20,60,140,0.85)';
  c.font = '11px system-ui, sans-serif';
  c.fillText(`설치 가능 ${pts.length.toLocaleString()}곳 (높이 ${PMH} m)`, 8, 14);
}

async function pmToggle(on){
  const btn = document.getElementById('pmOn');
  if (on && !(await pmLoad())) {
    document.getElementById('pmBar').style.display = '';
    pmBar('site.json 을 읽지 못했다. <code>python src/export_site.py</code> 로 만든다.');
    return;
  }
  PM = on;
  btn.setAttribute('aria-pressed', String(on));
  ['pmH', 'pmClear'].forEach(id => {
    const e = document.getElementById(id); if (e) e.style.display = on ? '' : 'none'; });
  document.getElementById('pmBar').style.display = on ? '' : 'none';
  if (on) {
    if (PMBASE === null) PMBASE = D.cameras.slice();
    const sel = document.getElementById('pmH');
    const hs = (Mounts.presetHeights ? Mounts.presetHeights(MD) : [3, 6, 9, 12]);
    sel.innerHTML = hs.map(h => `<option value="${h}">${h} m</option>`).join('');
    PMH = parseFloat(sel.value);
    PMOK = null;
    if (MODE === '3d') {          // 3D 는 역변환이 없다. 평면으로 내린다.
      MODE = '2d';
      document.querySelectorAll('#segmode button').forEach(x =>
        x.setAttribute('aria-pressed', String(x.dataset.m === '2d')));
    }
    pmPaint();
  } else {
    D.cameras = PMBASE || D.cameras;
    render();
  }
}

/* 지도 클릭 -> 세계 좌표 -> 설치 가능 판정 -> 카메라 추가 */
function pmClick(ev){
  if (!PM || !ENG) return;
  const cv = document.getElementById('map');
  const r = cv.getBoundingClientRect();
  const w = VIEWER.unproject(ev.clientX - r.left, ev.clientY - r.top, 0);
  if (!w) { pmBar('3D 에서는 놓을 수 없다. <b>2D</b> 나 <b>2.5D</b> 로 바꾸세요.'); return; }
  let x = w.x, y = w.y, yaw = 0;
  const z = PMH;
  if (!Mounts.placeable(MD, x, y, z)) {
    pmBar(`(${x.toFixed(1)}, ${y.toFixed(1)}) 은 높이 ${z}m 에 설치할 수 없는 자리다.`
        + ' 구조물 상부·측면·가설 장비 위·폴만 가능하다.');
    return;
  }
  if (Mounts.kindAt(MD, x, y, z) === 'structure_side') {
    const off = Mounts.sideMount(MD, x, y, z);
    if (off) { x = off.x; y = off.y; yaw = off.yaw; }
  }
  ENG.add({ x: x, y: y, z: z, yaw: yaw });
  pmPaint();
}

/* ── 직접 배치 ─────────────────────────────────────────────────────────
 * 사용자가 설치 가능 위치 중에서 카메라를 고르면 P_total 을 브라우저에서
 * 다시 계산한다. 그러려면 카메라별 검출확률이 있어야 하는데, 전 후보를 다
 * 실으면 37MB 라 96개만 내보냈다(src/export_picker.py). 세 배치가 실제로
 * 고른 카메라는 무조건 포함돼 있어 그 배치를 화면에서 재현할 수 있다.
 *
 * 탭을 처음 열 때만 읽는다 — 12MB 를 첫 화면에서 받으면 로딩이 늦어진다. */
let MX = null, MSEL = new Set(), MIDX = null;

async function loadMatrix(){
  if (MX) return MX;
  const [meta, buf] = await Promise.all([
    fetch('pmatrix.json').then(r=>r.json()),
    fetch('pmatrix.bin').then(r=>r.arrayBuffer())]);
  MX = {meta, a: new Uint8Array(buf), n: meta.n_voxels};
  // 행렬의 셀 순서 -> D.voxels 인덱스. 한 번만 만든다.
  const pos = new Map(D.voxels.map((v,i)=>[v.id,i]));
  MIDX = meta.voxel_ids.map(id=>pos.get(id));
  return MX;
}

/* 선택된 카메라로 P_total 을 다시 계산해 복셀에 써 넣는다.
 * P_total = 1 - Π(1-P) — 중첩은 페널티가 아니라 이득이다(CLAUDE.md §5.3). */
/* 100점 만점 채점 — 브라우저판.
 *
 * **규칙은 Python 이 정본이다**(src/score.py). 배점표·요구곡선·등급경계·치명
 * 가중치를 여기 다시 적으면 한쪽만 고쳤을 때 조용히 어긋난다. data.json 의
 * `score.rule` 에 실려 온 것을 그대로 읽는다. 구역 인덱스만 복셀에서 만든다.
 *
 * 직접 배치로 카메라를 바꾸면 점수가 따라 움직여야 한다 - 안 그러면 머리의
 * 숫자가 화면 아래와 다른 배치를 가리킨다.
 */
function scoreOf(ptOf){
  const rule = (D.placements && Object.values(D.placements)[0] || {}).score?.rule;
  if (!rule) return null;
  const req = rule.required_by_weight, grades = rule.grades;
  const critW = rule.critical_weight, cap = rule.critical_grade_cap;
  const thr = D.threshold;

  /* 구역 -> {가중치, 셀 목록}. 구역 밖은 한 칸을 따로 차지한다(배경).
   *
   * **가중치는 셀에서 뽑지 않는다.** 셀의 w 는 겹친 구역 중 최댓값이라
   * (안전 측면의 보수적 판정), 그것을 구역 가중치로 쓰면 약한 구역이 강한
   * 구역의 값을 빌려 온다 - 콘크리트 타설(w2)이 슬래브 단부(w10)와 겹쳐
   * w10 으로 잡혔고, Σ가중치가 33 대신 41 이 되어 배점이 통째로 어긋났다
   * (실측: 5.5점이 4.4점으로). 구역의 제 가중치는 Python 이 낸 rows 에 있다. */
  const zw = {};
  ((Object.values(D.placements)[0].score || {}).rows || [])
    .forEach(r => { zw[r.zone] = r.weight; });
  const zs = {};
  D.voxels.forEach((v, i) => {
    if (v.occupiable === false) return;
    const names = (v.zones && v.zones.length) ? v.zones : ['_background'];
    names.forEach(n => {
      if (!(n in zw)) return;                 // 채점표에 없는 구역은 세지 않는다
      const e = zs[n] || (zs[n] = { w: zw[n], idx: [] });
      e.idx.push(i);
    });
  });
  const wsum = Object.values(zs).reduce((a, e) => a + e.w, 0);
  if (!wsum) return null;

  let total = 0; const crit = [];
  let worst = null, worstLost = -1;
  for (const [name, e] of Object.entries(zs)) {
    const alloc = 100 * e.w / wsum;
    let ok = 0;
    for (const i of e.idx) if (ptOf(i) >= thr) ok++;
    const cov = ok / e.idx.length;
    const r = req[e.w] ?? req[String(e.w)] ?? 1;
    const earned = alloc * Math.min(1, r > 0 ? cov / r : 1);
    total += earned;
    if (e.w >= critW && cov < r) crit.push(name);
    if (alloc - earned > worstLost) { worstLost = alloc - earned; worst = name; }
  }
  total = Math.round(total * 100) / 100;
  let grade = 'E';
  for (const g of grades) if (total >= g.min) { grade = g.grade; break; }
  const capped = crit.length > 0 && grade < cap;
  return { total, grade: capped ? cap : grade, grade_capped_by_critical: capped,
           critical_failures: crit, biggest_loss: worst,
           rows: (Object.values(D.placements)[0].score || {}).rows || [] };
}

function recalcManual(){
  const {meta, a, n} = MX;
  const sel = meta.cameras.map((c,i)=>MSEL.has(c.id)?i:-1).filter(i=>i>=0);
  const keep = new Float32Array(n).fill(1);          // Π(1-P)
  for (const ci of sel){
    const off = ci*n;
    for (let j=0;j<n;j++){ const b=a[off+j]; if (b) keep[j] *= 1 - b/255; }
  }
  const thr = meta.threshold, W = meta.weights;
  let num=0, den=0, fail=0;
  for (let j=0;j<n;j++){
    const pt = 1 - keep[j];
    D.voxels[MIDX[j]].P_total_manual = pt;
    const w = W[j]; num += w*pt; den += w;
    if (pt < thr) fail++;
  }
  // 머리의 점수도 이 배치로 다시 잰다. P_total_manual 을 이미 채워 두었다.
  const sc = scoreOf(i => D.voxels[i].P_total_manual ?? 0);
  return {wdr: den? num/den : 0, fail, n, picked: sel.length,
          budget: meta.camera_budget, score: sc};
}

function renderManual(){
  const r = recalcManual();
  const over = r.picked > r.budget;
  document.getElementById('mstat').innerHTML =
    `<span>선택 <b>${r.picked}대</b> / 예산 ${r.budget}대`
    + (over? ' <span style="color:var(--color-warn,#8C2018)">초과</span>':'') + `</span>`
    + `<span>WDR <b>${pct(r.wdr)}</b></span>`
    + `<span>미달 <b>${r.fail.toLocaleString()}</b> / ${r.n.toLocaleString()}</span>`;
  if (r.score) paintScore(r.score, `직접 배치 ${r.picked}대`);
  // VIEW 는 그대로 둔다. render() 가 placements[VIEW] 를 찾으므로
  // 'manual' 을 넣으면 배치 탭·델타 띠가 무너진다.
  mountMap('manual', [], [...MSEL]);
}

async function openManual(){
  const box = document.getElementById('mlist');
  if (!box || box.dataset.on) { if (MX) renderManual(); return; }
  try { await loadMatrix(); } catch(e){
    box.innerHTML = '<p style="grid-column:1/-1;color:var(--color-muted);line-height:1.6">'
      + '검출확률 행렬(<code>pmatrix.bin</code>)이 없다. 현장을 바꾼 뒤에는 '
      + '<code>python src/export_picker.py</code> 로 다시 내보내야 한다.</p>';
    return; }
  const KO = {boundary_pole:'현장 경계 폴', core_top:'코어 상부',
              scaffold_rail:'비계 난간', tower_crane:'타워크레인'};
  const g = {};
  MX.meta.cameras.forEach(c=>(g[c.mount]=g[c.mount]||[]).push(c));
  box.innerHTML = Object.entries(g).map(([m,cs])=>
    `<h4>${KO[m]||m} ${cs.length}</h4>` + cs.map(c=>
      `<label><input type="checkbox" data-c="${c.id}">`
      + `${c.id} <span class="mnt">z${c.z}m</span></label>`).join('')).join('');
  box.dataset.on = '1';
  box.querySelectorAll('input[data-c]').forEach(b=>b.onchange=()=>{
    b.checked ? MSEL.add(b.dataset.c) : MSEL.delete(b.dataset.c);
    renderManual(); });
  const setSel = (ids)=>{
    MSEL = new Set(ids.filter(i=>MX.meta.cameras.some(c=>c.id===i)));
    box.querySelectorAll('input[data-c]').forEach(b=>b.checked=MSEL.has(b.dataset.c));
    renderManual(); };
  document.getElementById('mgeo').onclick = ()=>{
    const P = D.placements || {};
    const k = P.baseline ? 'baseline' : Object.keys(P)[0];
    setSel(((P[k]||{}).camera_ids)||[]);
  };
  document.getElementById('mclr').onclick = ()=>setSel([]);
  // 탭을 열면 **평가한 배치**로 시작한다. 종전 기본값은 사라진 'empirical'
  // 을 가리켜 선택이 비어 있었고, 그러면 머리의 점수가 0 점으로 떨어져
  // 개요 탭과 다른 말을 한다.
  document.getElementById('mgeo').onclick();
}

/* 평면도. 탭을 처음 열 때 한 번만 그린다 — 숨어 있을 때 그리면 캔버스
   크기가 0 이라 아무것도 안 나온다. */
let PLAN = null;
function mountPlan(view){
  const cv = document.getElementById('plan');
  if (!cv || !window.SitePlan) return;
  PLAN = new SitePlan.SitePlan(cv, D, {
    chosen: (D.placements[view] || {}).camera_ids || [] });
  const leg = document.getElementById('planlegend');
  if (leg) leg.innerHTML = PLAN.legendHTML();
}

/* 점수 카드를 다시 칠한다. render() 를 통째로 다시 돌리면 직접 배치 탭이
   닫히므로 이 카드만 갈아 끼운다. */
function paintScore(sc, tag){
  const card = document.querySelector('.kpi.score');
  if (!card || !sc) return;
  card.querySelector('.k').textContent = '배치 점수 · 100점 만점'
    + (tag ? ' · ' + tag : '');
  card.querySelector('.v').innerHTML =
    `${sc.total.toFixed(1)}<span class="unit">점</span>`
    + `<span class="grade">${sc.grade}</span>`;
  const zl = (sc.rows.find(r=>r.zone===sc.biggest_loss)||{}).label || sc.biggest_loss;
  card.querySelector('.note').textContent = sc.grade_capped_by_critical
    ? `치명 구역 ${sc.critical_failures.length}곳이 요구 미달 — 등급 상한 ${sc.grade}`
    : (zl ? `가장 많이 잃은 곳 · ${zl}` : '');
}

function wire(){
  const pmB = document.getElementById('pmOn');
  if (pmB) pmB.onclick = () => pmToggle(!PM);
  const pmHsel = document.getElementById('pmH');
  if (pmHsel) pmHsel.onchange = () => {
    PMH = parseFloat(pmHsel.value); PMOK = null; pmDrawOverlay(); };
  const pmC = document.getElementById('pmClear');
  if (pmC) pmC.onclick = () => { while (ENG && ENG.cams.length) ENG.remove(0); pmPaint(); };
  const mapc = document.getElementById('map');
  if (mapc && !mapc.dataset.pm) { mapc.dataset.pm = '1'; mapc.addEventListener('click', pmClick); }
  document.querySelectorAll('#segmode button').forEach(b=>b.onclick=()=>{
    MODE = b.dataset.m;
    document.querySelectorAll('#segmode button').forEach(x=>
      x.setAttribute('aria-pressed', String(x===b)));
    VIEWER.setMode(MODE);
    pmDrawOverlay();
  });
  const so = document.getElementById('solids');
  if (so) so.onchange = () => VIEWER.set('showSolids', so.checked);
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', String(x===t)));
    document.querySelectorAll('.tabpanel').forEach(p=>
      p.classList.toggle('on', p.dataset.p === t.dataset.t));
    document.getElementById('tabbody').scrollTop = 0;
    if (t.dataset.t === 'manual') openManual();
    if (t.dataset.t === 'plan') {
      const view = D.placements[VIEW] ? VIEW : Object.keys(D.placements)[0];
      if (!PLAN) mountPlan(view); else PLAN.resize();
    }
  });
}

addEventListener('resize', () => { if (VIEWER) { const cv=document.getElementById('map');
  cv.style.height = Math.max(180, cv.parentElement.getBoundingClientRect().height-16)+'px';
  VIEWER.resize(); } }, {passive:true});

function boot(d){
  if (!d || d.status !== 'ok') throw new Error('데이터를 읽지 못했다');
  D = d; render();
}
function fail(msg){
  document.getElementById('app').innerHTML =
    '<div class="err"><b>표시할 수 없습니다.</b><br>' + msg +
    '<br><br><code>start.bat</code> 을 실행하거나 report.py 를 다시 돌려 ' +
    'data.json / data.js 를 만드십시오.</div>';
}

/* 정본은 data.json 을 fetch 하는 쪽이다(CLAUDE.md §7). data.js 는 같은 내용의
   사본이며 file:// 로 열었을 때만 쓴다 — 브라우저가 file:// 에서 fetch 를 막고
   실패한 요청을 콘솔에 남기므로, 프로토콜을 먼저 보고 아예 시도하지 않는다. */
if (location.protocol === 'file:') {
  try { boot(window.SITE_DATA); } catch(e){ fail(e.message + ' (data.js 폴백)'); }
} else {
  fetch('data.json')
    .then(r => { if(!r.ok) throw new Error('data.json HTTP '+r.status); return r.json(); })
    .then(boot)
    .catch(e => { try { boot(window.SITE_DATA); } catch(_) { fail(e.message); } });
}
</script>
